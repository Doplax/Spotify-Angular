<div class="side-bar">

  <!-- Head Section -->
  <section class="head-section">
    <div class="top-section">
      <button
        type="button"
        class="library-toggle"
        (click)="toggleCollapsed()"
        matTooltip="Tu Biblioteca"
        [attr.aria-label]="isCollapsed ? 'Expandir biblioteca' : 'Colapsar biblioteca'"
        [attr.aria-expanded]="!isCollapsed"
      >
        <shared-svg-library class="g-icon" />
        <span class="library-label">Tu Biblioteca</span>
      </button>

      <div class="head-actions">
        <button
          type="button"
          class="icon-btn"
          [matMenuTriggerFor]="addMenu"
          matTooltip="Crear"
          aria-label="Crear playlist o carpeta"
        >
          <mat-icon>add</mat-icon>
        </button>
        <mat-menu #addMenu="matMenu" class="sidebar-menu" xPosition="before">
          <button mat-menu-item (click)="createPlaylist()">
            <mat-icon>queue_music</mat-icon>
            <span>Crear playlist</span>
          </button>
          <button mat-menu-item (click)="createFolder()">
            <mat-icon>folder</mat-icon>
            <span>Crear carpeta</span>
          </button>
        </mat-menu>

        <button
          type="button"
          class="icon-btn collapse-btn"
          (click)="toggleCollapsed()"
          [matTooltip]="isCollapsed ? 'Expandir' : 'Mostrar más'"
          [attr.aria-label]="isCollapsed ? 'Expandir biblioteca' : 'Colapsar biblioteca'"
        >
          <mat-icon>{{ isCollapsed ? 'arrow_back' : 'arrow_forward' }}</mat-icon>
        </button>
      </div>
    </div>
  </section>

  <!-- Filter chip -->
  <section class="g-chip-section">
    <span class="g-chip-btn">Listas</span>
  </section>

  <!-- Search + sort -->
  <section class="search-section">
    <shared-svg-search class="search-icon"/>
    <button
      type="button"
      class="sort-trigger"
      [matMenuTriggerFor]="sortMenu"
      matTooltip="Ordenar por"
      [attr.aria-label]="'Ordenar por ' + currentSortOption.label"
    >
      <span>{{ currentSortOption.label }}</span>
      <mat-icon>{{ currentSortOption.icon }}</mat-icon>
    </button>
    <mat-menu #sortMenu="matMenu" class="sidebar-menu" xPosition="before">
      <span class="menu-section-title" mat-menu-item disabled>Ordenar por</span>
      @for (option of sortOptions; track option.id) {
        <button
          mat-menu-item
          [class.active]="option.id === currentSort"
          (click)="setSort(option.id)"
        >
          <mat-icon>{{ option.icon }}</mat-icon>
          <span>{{ option.label }}</span>
        </button>
      }
    </mat-menu>
  </section>

  <!-- Playlists -->
  <section class="recents-list-section">
    @for (playlist of playlists; track playlist.id) {
      <div
        class="playList-card g-hover-grey"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Abrir lista ' + playlist.title"
        [style.view-transition-name]="'playlist-' + playlist.id"
        (click)="navigateTo(playlist)"
        (keydown.enter)="navigateTo(playlist)"
        (keydown.space)="navigateTo(playlist); $event.preventDefault()"
      >

        <!-- Cover image with play overlay on hover -->
        <div class="playList-image" [style.background-color]="playlist.color">
          @if (coverMap[playlist.id]) {
            <img
              class="cover-img"
              [src]="coverMap[playlist.id]"
              [alt]="playlist.title"
              appImgBroken
            />
          }
          <button class="cover-play-overlay" (click)="playPlaylist($event, playlist)" title="Reproducir">
            <mat-icon>play_arrow</mat-icon>
          </button>
        </div>

        <div class="playList-info">
          <span class="title">{{ playlist.title }}</span>
          <span class="subTitle">Playlist</span>
        </div>

      </div>
    }
  </section>

</div>
